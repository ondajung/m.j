<!-- 🟢 Formspree 연동 문의 폼 영역 -->
<section style="background: #ffffff; padding: 90px 20px; border-top: 1px solid #eee;">
    <div style="max-width: 750px; margin: 0 auto; background: #fdfbf7; border: 1px solid #ecdcc0; border-radius: 20px; padding: 50px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.02);">
        
        <div style="text-align: center; margin-bottom: 40px;">
            <p class="font-eng" style="color: #C5A059; font-size: 12px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;">ONLINE INQUIRY</p>
            <h2 class="font-title" style="font-size: 28px; color: #111; margin: 0 0 10px 0; font-weight: 700;">OEM / ODM 파트너십 문의하기</h2>
            <p style="font-size: 14px; color: #666; margin: 0;">작성해주신 내용은 담당자 확인 후 신속하게 답변해 드립니다.</p>
        </div>

        <!-- 💡 action URL이 새 엔드포인트(xbgdabor)로 업데이트되었습니다. -->
        <form action="[https://formspree.io/f/xbgdabor](https://formspree.io/f/xbgdabor)" method="POST">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px;">회사명 / 단체명 <span style="color: #C5A059;">*</span></label>
                    <input type="text" name="company" required placeholder="예) (주)온다정푸드" class="inquiry-input" style="width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.2s;">
                </div>
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px;">담당자 성함 <span style="color: #C5A059;">*</span></label>
                    <input type="text" name="name" required placeholder="예) 홍길동" class="inquiry-input" style="width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.2s;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px;">연락처 (휴대폰) <span style="color: #C5A059;">*</span></label>
                    <input type="tel" name="phone" required placeholder="예) 010-0000-0000" class="inquiry-input" style="width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.2s;">
                </div>
                <div>
                    <label style="display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px;">이메일 주소</label>
                    <input type="email" name="_replyto" placeholder="예) example@email.com" class="inquiry-input" style="width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.2s;">
                </div>
            </div>

            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 13px; font-weight: 700; color: #333; margin-bottom: 8px;">문의 내용 <span style="color: #C5A059;">*</span></label>
                <textarea name="message" required rows="5" placeholder="희망 방식(OEM/ODM), 희망 품목, 예상 수량, 기타 문의 사항 등을 자세히 적어주세요." class="inquiry-textarea" style="width: 100%; padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; box-sizing: border-box; resize: vertical; transition: all 0.2s;"></textarea>
            </div>

            <div style="text-align: center;">
                <button type="submit" style="background-color: #C5A059; color: white; border: none; padding: 16px 50px; font-size: 16px; font-weight: 700; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3); transition: all 0.3s;" onmouseover="this.style.backgroundColor='#b38f49'; this.style.transform='translateY(-2px)';" onmouseout="this.style.backgroundColor='#C5A059'; this.style.transform='translateY(0)';">
                    문의 내용 전송하기
                </button>
            </div>

        </form>

    </div>
</section>
